<!DOCTYPE HTML>
<html lang="zh-CN">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="UTF-8">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            color: #00dd00;
            background-color: #202124;
        }

        h3 {
            margin: 0;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body>
    <h3><a href="/" id="loginLink">Log Back In</a></h3>
</body>

</html>
<script>
(()=>{const e=document.getElementById("loginLink"),x=new XMLHttpRequest();x.open("GET","/language");x.onload=()=>{try{if(JSON.parse(x.responseText).language==="zh-CN")e.textContent="返回登录";}catch(_){};};x.send();})();
</script>
